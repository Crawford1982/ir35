<!-- ─── COOKIE CONSENT BANNER ─── -->
<div id="cookie-banner" role="dialog" aria-label="Cookie consent">
  <p>
    We use cookies to understand how you use this site and improve it. No personal data is sold or shared.
    See our <a href="/privacy.html">Privacy Policy</a>.
  </p>
  <div class="cookie-btns">
    <button class="btn-decline" onclick="cookieChoice(false)">Decline</button>
    <button class="btn-accept" onclick="cookieChoice(true)">Accept Analytics</button>
  </div>
</div>

<script>
function cookieChoice(accepted) {
  localStorage.setItem('cookie_consent', accepted ? 'accepted' : 'declined');
  document.getElementById('cookie-banner').classList.remove('show');
  if (accepted) loadGA();
}
document.addEventListener('DOMContentLoaded', function() {
  var consent = localStorage.getItem('cookie_consent');
  if (!consent) {
    setTimeout(function() {
      document.getElementById('cookie-banner').classList.add('show');
    }, 1200);
  } else if (consent === 'accepted') {
    loadGA();
  }
});
</script>
